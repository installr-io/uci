name: Release UCI

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

    workflow_dispatch:
        inputs:
            tag:
                description: Version tag to release
                required: true

env:
    REGISTRY: ghcr.io

jobs:
    build-and-package:
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.PA_TOKEN }}

            - name: Build & push base
              env:
                  tag: ${{ inputs.tag || github.ref_name }}
              run: ./build --tag ${tag} --push base

            - name: Build & push jre21
              env:
                  tag: ${{ inputs.tag || github.ref_name }}
              run: ./build --tag ${tag} --push jre21

    create-release:
        needs: build-and-package
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ inputs.tag || github.ref_name }}
              run: |
                latest=$( gh release view --repo="$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true )
                newest=$( printf '%s\n' "$latest" "$tag" | sort -V | tail -1 )
                gh release create \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${tag}" \
                    --latest=$( [ "$newest" = "$tag" ] && echo true || echo false ) \
                    --generate-notes \
                    --verify-tag \
                    "$tag"
